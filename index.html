<!DOCTYPE html>
<html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cachinho de Framboesa</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Croissant+One&display=swap" rel="stylesheet">
        
        <style>
            h1 {
                font-family: 'Croissant One', serif;
                font-size: 48px;
                margin-bottom: 25px;
                color:#a61b83;
            }
            footer {
            background-color:#cf0e88;
            color: white;
            text-align: center;
            padding: 0,3px;
            position:fixed ;
            bottom: 0;
            width: 100%;
            font-size: 12px;
            }
            footer a {
                color: #f1f1f1;
                text-decoration: none;
            }
            footer a:hover {
                text-decoration: underline;
            }   
            .cabecalho{
             background-color:#cf0e88;
            }
            .conteudo{
                width:1200px;
                margin:50px auto;
                display:flex;
                justify-content:space-between;
                align-items:flex-start;
            }
            .foto-blog{
                width:800px;
                transition:.3s;
                cursor:pointer;
            }
            .foto-blog:hover{
                transform:scale(1.05);
            }
            .blogs-antigos{
                width:50%;
            }
            details{
                background:#d96ba8;
                border-radius:20px;
                padding:20px;
            }
            summary{
                font-family: 'Croissant One', serif;
                list-style:none;
                cursor:pointer;
                font-size:40px;
                color:white;
                text-align:center;
            }
            summary::-webkit-details-marker{
                display:none;
            }
            .lista-blogs{
                margin-top:20px;
                display:flex;
                flex-direction:column;
                align-items: center;
                gap:10px;
            }
            .lista-blogs img{
                width:350px;
                border-radius:15px;
                transition:.3s;
            }
            .lista-blogs img:hover{
                transform:scale(1.05);
            }
            .lista-blogs a{
                display:block;
                width:100%;
                text-align:center;
            }
        </style>
    </head>

    <body  style="background-image:url('img/fundo.png');">
        <nav class="navbar navbar-expand-sm cabecalho">
            <div class="container-fluid">
                <a href="index.html"><img src="img/Framboesa.png" class="navbar-brand" width="160"></a>
                <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar" aria-expanded="false">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="navbar-collapse collapse" id="collapsibleNavbar" style="">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <h1><a class="nav-link" href="index.html" style="color: white;">Cachinho de Framboesa</a></h1>
                        </li> 
                    </ul>
            </div>
            <a href="login.html"><img src="img/usuario.png" class="navbar-brand" width="160"></a>        
            </div>
        </nav>

        <main class="conteudo">
            <section class="blog-atual">
                <a href="blogAtual.html">
                    <img src="img/moranguinho.png" class="foto-blog">
                </a>
            </section>

            <section class="blogs-anteriores">
                <details>
                    <summary>Blogs anteriores</summary>
                    <div class="lista-blogs">
                        <a href="blog1.html" >
                            <img src="img/blog1.png">
                        </a>
                        <a href="blog2.html">
                            <img src="img/blog2.png">
                        </a>
                        <a href="blog3.html">
                            <img src="img/blog3.png">
                        </a>
                    </div>
                </details>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Cachinho de Framboesa.</p>
        </footer>
    </body>
</html>
